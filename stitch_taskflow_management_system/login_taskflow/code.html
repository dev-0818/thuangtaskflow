<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - TaskFlow</title>
<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary": "#e4c098",
                      "secondary-fixed-dim": "#c9c5c7",
                      "primary": "#e6c098",
                      "on-surface-variant": "#d2c4b8",
                      "secondary-container": "#484648",
                      "error-container": "#93000a",
                      "on-tertiary": "#422c0f",
                      "surface-container-highest": "#353534",
                      "secondary": "#c9c5c7",
                      "on-primary-fixed-variant": "#5c4223",
                      "on-secondary-container": "#b8b4b6",
                      "on-tertiary-fixed": "#2a1701",
                      "tertiary-fixed": "#ffddb8",
                      "surface-container-lowest": "#0e0e0e",
                      "surface-container-high": "#2a2a2a",
                      "on-surface": "#e5e2e1",
                      "on-primary-container": "#3d260a",
                      "error": "#ffb4ab",
                      "secondary-fixed": "#e6e1e3",
                      "primary-fixed": "#ffddba",
                      "tertiary-container": "#ad8d68",
                      "primary-container": "#ae8c68",
                      "on-secondary-fixed-variant": "#484648",
                      "on-primary": "#432c0f",
                      "outline": "#9b8f84",
                      "on-error-container": "#ffdad6",
                      "background": "#131313",
                      "on-error": "#690005",
                      "outline-variant": "#4f453c",
                      "inverse-primary": "#765939",
                      "surface-bright": "#393939",
                      "surface-container-low": "#1c1b1b",
                      "on-primary-fixed": "#2b1701",
                      "primary-fixed-dim": "#e6c098",
                      "surface-dim": "#131313",
                      "surface-container": "#201f1f",
                      "on-secondary": "#313032",
                      "tertiary-fixed-dim": "#e4c098",
                      "surface": "#131313",
                      "inverse-surface": "#e5e2e1",
                      "on-tertiary-container": "#3c270b",
                      "surface-variant": "#353534",
                      "on-secondary-fixed": "#1c1b1d",
                      "inverse-on-surface": "#313030",
                      "surface-tint": "#e6c098",
                      "on-tertiary-fixed-variant": "#5b4223",
                      "on-background": "#e5e2e1"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "base": "8px",
                      "margin-desktop": "40px",
                      "margin-mobile": "16px",
                      "gutter": "24px",
                      "container-max": "1280px"
              },
              "fontFamily": {
                      "body-lg": ["Inter"],
                      "display-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "body-md": ["Inter"],
                      "label-sm": ["Inter"],
                      "label-md": ["Inter"],
                      "headline-lg": ["Inter"]
              },
              "fontSize": {
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
        /* Custom Input Autofill styling for dark mode consistency */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #201f1f inset !important;
            -webkit-text-fill-color: #e5e2e1 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop selection:bg-primary/30 selection:text-primary">
<!-- Ambient Background Glow -->
<div class="fixed inset-0 pointer-events-none flex items-center justify-center overflow-hidden">
<div class="w-[800px] h-[800px] bg-primary/5 rounded-full blur-[120px] opacity-50 transform -translate-y-1/4"></div>
</div>
<!-- Main Content Container -->
<main class="w-full max-w-[440px] relative z-10 flex flex-col items-center">
<!-- Login Card -->
<div class="w-full bg-surface-container/80 backdrop-blur-xl border border-outline-variant/50 rounded-xl p-8 md:p-10 shadow-2xl shadow-black/50">
<!-- Brand Header -->
<div class="mb-10 text-center">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">TaskFlow</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Premium Workspace</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Username Field -->
<div class="space-y-2 group">
<label class="block font-label-md text-label-md text-on-surface-variant group-focus-within:text-primary transition-colors" for="username">
                        Username
                    </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 group-focus-within:text-primary transition-colors" style="font-size: 20px;">
                            person
                        </span>
<input class="w-full bg-surface-container-highest/50 border-0 border-b border-outline-variant text-on-surface font-body-lg text-body-lg pl-12 pr-4 py-3.5 rounded-t-md focus:ring-0 focus:border-primary focus:bg-surface-container-highest transition-all placeholder:text-on-surface-variant/40" id="username" name="username" placeholder="Enter your username" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2 group">
<div class="flex justify-between items-end mb-2">
<label class="block font-label-md text-label-md text-on-surface-variant group-focus-within:text-primary transition-colors" for="password">
                            Password
                        </label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors focus:outline-none focus:underline underline-offset-4" href="#">
                            Forgot Password?
                        </a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 group-focus-within:text-primary transition-colors" style="font-size: 20px;">
                            lock
                        </span>
<input class="w-full bg-surface-container-highest/50 border-0 border-b border-outline-variant text-on-surface font-body-lg text-body-lg pl-12 pr-4 py-3.5 rounded-t-md focus:ring-0 focus:border-primary focus:bg-surface-container-highest transition-all placeholder:text-on-surface-variant/40" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary-container text-[#1A1105] font-label-md text-label-md py-4 rounded-lg transition-all duration-200 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" type="submit">
                        Sign In
                        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Footer Note -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant/70 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-size: 16px;">info</span>
                Account creation is managed by administrators.
            </p>
</div>
</main>
</body></html>
